[package]
name = "terasweep"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
description = "Reference-checked model fitting, prediction, and factorized parameter sweeps"
repository = "https://github.com/autonomio/Terasweep"
readme = "README.md"
publish = false
include = ["/src/**", "/scripts/tide_backend.py", "/README.md"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
